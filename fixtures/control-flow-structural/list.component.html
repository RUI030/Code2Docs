<div *ngIf="isReady; else loading">
  <p *ngFor="let item of items; trackBy: trackById; let i = index">
    {{ i }}: {{ item.name | uppercase }}
  </p>
</div>
<ng-template #loading><span>Loading…</span></ng-template>

<div [ngSwitch]="mode">
  <p *ngSwitchCase="'edit'">Editing</p>
  <p *ngSwitchDefault>Viewing</p>
</div>
